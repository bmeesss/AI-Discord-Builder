# Self-hosting baseline: just the Discord bot — no database, no extra services.
# Persistence (rollback history, conversations) is stored in local JSON files
# inside the named volume `bot_data` (see DATA_DIR).
# Ollama is deliberately not part of this file (see compose.local-ai.yaml).
# Start with: docker compose up -d
services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      # JSON files live on the named volume so they survive container
      # restarts and image rebuilds (but not `docker compose down -v`).
      DATA_DIR: ${DATA_DIR:-/app/data}
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
    ports:
      # Host port : container port both follow WEB_PORT (the bot binds there).
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"

volumes:
  bot_data:
