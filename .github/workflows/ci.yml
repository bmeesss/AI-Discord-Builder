name: CI

on:
  push:
  pull_request:

jobs:
  # Unit tests: no external services — the bot is fully database-free.
  # Opt-in integration tests (Ollama) are skipped here.
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Dockerfile runtime; 3.12 = common host version.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile checks
        run: python -m compileall -q ai builder commands security services setup storage tests web config.py main.py

      - name: Ruff (critical errors)
        run: ruff check --select E9,F --exclude .venv .

      - name: Unit tests (config validation included)
        run: python -m pytest -q --ignore=tests/integration

  # Static validation of both Compose configurations. Runs without a daemon.
  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.local-ai.yaml config --quiet

  # Validate render.yaml against the official Render Blueprint JSON schema.
  render-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate render.yaml against Render's JSON schema
        run: |
          pip install check-jsonschema
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml
